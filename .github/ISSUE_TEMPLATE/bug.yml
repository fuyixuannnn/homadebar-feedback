name: 问题反馈 / Report a problem
description: 告诉我们哪里出了问题 / Tell us what went wrong
title: "[问题] "
labels: [bug, 待整理]
assignees: [fuyixuannnn]
body:
  - type: markdown
    attributes:
      value: "内容公开可见，请勿填写私人信息。可以使用你熟悉的语言。 / Posts are public. Do not share private information. Use your preferred language."
  - type: textarea
    id: problem
    attributes:
      label: 遇到了什么问题？ / What happened?
      description: 描述实际表现和你期待的结果。 / Describe what happened and what you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 如何复现？ / Steps to reproduce
      description: 按顺序描述操作；不确定也可以留空。 / Describe the steps, if known.
  - type: input
    id: version
    attributes:
      label: App 与 iOS 版本 / App and iOS version
      placeholder: "例如 / e.g. HomadeBar 1.3, iOS 26"
  - type: textarea
    id: screenshots
    attributes:
      label: 补充说明或截图 / More details or screenshots
      description: 上传前遮盖个人信息。 / Hide personal information before uploading.
